[project]
name = "fastapi-dbbackup"
version = "0.1.4"
description = "Database-native backup tool for FastAPI, SQLAlchemy, and SQLModel projects."
authors = [
    { name = "Rajesh", email = "contact@geekyshows.com" }
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
keywords = ["fastapi", "sqlalchemy", "sqlmodel", "backup", "database", "postgres", "mysql", "sqlite", "s3"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",

  "Topic :: Database",
  "Topic :: System :: Archiving :: Backup",
]

dependencies = [
    "sqlalchemy>=2.0.0",
    "boto3>=1.26.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
fastapi-dbbackup = "fastapi_dbbackup.cli:main"

[project.urls]
Homepage = "https://rajsolodev.github.io/fastapi-dbbackup/"
Repository = "https://github.com/rajsolodev/fastapi-dbbackup"
"Bug Tracker" = "https://github.com/rajsolodev/fastapi-dbbackup/issues"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["fastapi_dbbackup*"]

[tool.uv.workspace]
members = [
    "demo_project",
    "fastapi-dbbackup-example",
    ".",
]

[dependency-groups]
dev = [
    "mkdocs-material>=9.7.1",
    "mkdocstrings[python]>=1.0.2",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.1",
]

[tool.ruff]
line-length = 120
lint.select = [
  "A",     # flake8-builtins
  "AIR",   # Airflow
  "ASYNC", # flake8-async
  "B",     # flake8-bugbear
  "BLE",   # flake8-blind-except
  "C4",    # flake8-comprehensions
  "C90",   # McCabe cyclomatic complexity
  "E",     # pycodestyle
  "ERA",   # eradicate
  "EXE",   # flake8-executable
  "F",     # Pyflakes
  "G",     # flake8-logging-format
  "I",     # isort
  "ICN",   # flake8-import-conventions
  "INT",   # flake8-gettext
  "ISC",   # flake8-implicit-str-concat
  "N",     # pep8-naming
  "PGH",   # pygrep-hooks
  "PIE",   # flake8-pie
  "PL",    # Pylint
  "PT",    # flake8-pytest-style
  "PTH",   # flake8-use-pathlib
  "PYI",   # flake8-pyi
  "RET",   # flake8-return
  "RSE",   # flake8-raise
  "RUF",   # Ruff-specific rules
  "S",     # flake8-bandit
  "T10",   # flake8-debugger
  "TCH",   # flake8-type-checking
  "TID",   # flake8-tidy-imports
  "W",     # pycodestyle
  "YTT",   # flake8-2020
]
lint.ignore = [
  "B018",
  "B026",
  "B904",
  "N802",
  "N803",
  "N806",
  "PGH004",
  "PLR5501",
  "PLW2901",
  "PT009",
  "PT027",
  "PTH123",
  "RET505",
  "RET506",
  "RUF100",
  "S113",
  "S314",
  "S603",
  "S607",
]
lint.per-file-ignores."tests/*" = [
  "S101",
  "S106",
]
lint.pylint.allow-magic-value-types = [
  "int",
  "str",
]
lint.pylint.max-args = 12
lint.pylint.max-branches = 20
lint.pylint.max-returns = 7
lint.pylint.max-statements = 54
